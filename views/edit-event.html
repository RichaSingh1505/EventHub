<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Event | EventHub</title>
    <style>
        /* 1. Reset & Global Theme */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #06060c;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 2. Background Blobs (Matches your other pages) */
        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            filter: blur(100px);
            border-radius: 50%;
            opacity: 0.15;
            z-index: -1;
        }

        /* 3. Professional Glass Card */
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            margin: 20px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: -1px;
        }

        h1 span {
            color: #818cf8;
        }

        /* 4. Form Styling */
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, textarea {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            border-color: #818cf8;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.2);
        }

        /* 5. Update Button */
        .btn-update {
            margin-top: 10px;
            padding: 16px;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-update:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(129, 140, 248, 0.3);
            filter: brightness(1.1);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: white;
        }
    </style>
</head>
<body>

    <div class="blob" style="top: -200px; right: -100px;"></div>
    <div class="blob" style="bottom: -200px; left: -100px;"></div>

    <main class="card">
        <h1>Edit <span>Event</span></h1>

        <form id="editForm">
            <div class="input-group">
                <label for="title">Event Title</label>
                <input type="text" id="title" placeholder="e.g. New Year's Eve Party" required>
            </div>

            <div class="input-group">
                <label for="description">Description</label>
                <textarea id="description" placeholder="What is this event about?"></textarea>
            </div>

            <div class="input-group">
                <label for="date">Event Date</label>
                <input type="date" id="date" required>
            </div>

            <div class="input-group">
                <label for="location">Location</label>
                <input type="text" id="location" placeholder="e.g. Delhi, India">
            </div>

            <button type="submit" class="btn-update">Save Changes</button>
        </form>

        <a href="/event-list" class="back-link">Cancel and go back</a>
    </main>

    <script>
        // Get ID from URL /edit-event/1
        const id = window.location.pathname.split("/")[2];

        // Load existing data
        fetch("/events")
            .then(res => res.json())
            .then(events => {
                const event = events.find(e => e.id == id);
                if(event) {
                    document.getElementById("title").value = event.title || "";
                    document.getElementById("description").value = event.description || "";
                    document.getElementById("date").value = event.date ? event.date.split("T")[0] : "";
                    document.getElementById("location").value = event.location || "";
                }
            });

        // Handle Form Submission
        document.getElementById("editForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const updatedEvent = {
                title: document.getElementById("title").value,
                description: document.getElementById("description").value,
                date: document.getElementById("date").value,
                location: document.getElementById("location").value
            };

            fetch("/update-event/" + id, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(updatedEvent)
            })
            .then(res => res.text())
            .then(() => {
                alert("Event Updated Successfully!");
                window.location.href = "/event-list";
            })
            .catch(err => {
                alert("Error updating event");
                console.error(err);
            });
        });
    </script>

</body>
</html>
