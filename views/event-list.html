<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Events | EventHub</title>
    <style>
        /* 1. Global Reset & Professional Theme */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #06060c;
            color: #ffffff;
            min-height: 100vh;
            line-height: 1.6;
        }

        /* 2. Professional Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: 800;
            text-decoration: none;
            color: white;
            letter-spacing: -1px;
        }

        .nav-logo span { color: #818cf8; }

        .nav-links { display: flex; align-items: center; gap: 25px; }

        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover { color: white; }

        .user-welcome { color: #ffffff; font-weight: 600; font-size: 0.9rem; }
        
        .logout-link { color: #ef4444 !important; opacity: 0.8; }
        .logout-link:hover { opacity: 1; }

        /* 3. Main Layout Content */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 { font-size: 2.2rem; font-weight: 800; }
        h1 span { color: #818cf8; }

        /* 4. Search Bar */
        #searchInput {
            padding: 12px 20px;
            width: 320px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        #searchInput:focus {
            border-color: #818cf8;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.2);
        }

        /* 5. Event Grid & Professional Cards */
        #events-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 30px;
        }

        .event-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .event-card:hover {
            transform: translateY(-8px);
            border-color: rgba(129, 140, 248, 0.4);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* FIX: Making the Image fit perfectly */
        .event-image {
            width: 100%;
            height: 200px;
            object-fit: cover; /* This makes the image fill the box without stretching */
            display: block;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-body { padding: 24px; flex-grow: 1; }

        .event-title {
            font-size: 1.4rem;
            color: #ffffff;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .event-title:hover { color: #818cf8; }

        .event-desc {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .stats-badge {
            display: inline-block;
            margin-top: 15px;
            padding: 6px 12px;
            background: rgba(129, 140, 248, 0.1);
            color: #a5b4fc;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* 6. Action Buttons */
        .card-footer {
            padding: 20px 24px 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* FIX #5: real responsive breakpoint for the dashboard —
           previously this grid had no @media rules anywhere, so the
           "responsive dashboard" resume claim wasn't technically backed. */
        @media (max-width: 600px) {
            #events-container {
                grid-template-columns: 1fr !important;
            }

            #searchInput {
                width: 100%;
            }
        }

        .btn {
            padding: 10px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.3s;
            text-align: center;
        }

        .btn-edit { background: rgba(255, 255, 255, 0.08); color: white; }
        .btn-delete { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        .btn-view {
            background: #818cf8;
            color: white;
            grid-column: span 2;
            margin-top: 4px;
        }

        .btn:hover { filter: brightness(1.2); transform: translateY(-2px); }

    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/event-list" class="nav-logo">Event<span>Hub</span></a>
        
        <div class="nav-links">
            <a href="/event-list">Home</a>
            <a href="/create-event">Create Event</a>
            <span class="user-welcome" id="user-name">Welcome</span>
            <a href="/logout" class="logout-link">Logout</a>
        </div>
    </nav>

    <div class="container">
        <header class="header-section">
            <h1>Discover <span>Events</span></h1>
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search events by name or location..." 
                onkeyup="searchEvents()"
            >
        </header>

        <div id="events-container">
            </div>
    </div>

    <script>
        let allEvents = [];

        // Load Current User Info
        fetch("/current-user")
            .then(res => res.json())
            .then(data => {
                if (data.name) {
                    document.getElementById("user-name").innerText = "Hi, " + data.name;
                }
            });

        // Load Events from Server
        function loadEvents() {
            fetch("/events-with-count")
                .then(response => {
                    if(!response.ok) throw new Error("Server Error");
                    return response.json();
                })
                .then(events => {
                    allEvents = events;
                    displayEvents(events);
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById("events-container").innerHTML = "<p>Error loading events. Please try again later.</p>";
                });
        }

        // Display Events in Grid
        function displayEvents(events) {
            const container = document.getElementById("events-container");
            container.innerHTML = "";

            if(events.length === 0) {
                container.innerHTML = "<p style='color: #94a3b8;'>No events found.</p>";
                return;
            }

            events.forEach(event => {
                const card = document.createElement("div");
                card.classList.add("event-card");

                // Check for image, otherwise use a high-quality dark placeholder
                const imageSrc = event.image ? `/uploads/${event.image}` : 'https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?w=500&q=80';

                card.innerHTML = `
                    <img src="${imageSrc}" class="event-image" alt="Event Image">
                    
                    <div class="card-body">
                        <h3 class="event-title" onclick="openEvent(${event.id})">${event.title}</h3>
                        <p class="event-desc">${event.description}</p>
                        
                        <div class="info-row"><span>📅</span> <b>Date:</b> ${new Date(event.date).toLocaleDateString()}</div>
                        <div class="info-row"><span>📍</span> <b>Location:</b> ${event.location}</div>
                        
                        <div class="stats-badge">👥 ${event.registration_count} Registered</div>
                    </div>

                    <div class="card-footer">
                        <button class="btn btn-edit" onclick="editEvent(${event.id})">Edit</button>
                        <button class="btn btn-delete" onclick="deleteEvent(${event.id})">Delete</button>
                        <button class="btn btn-view" onclick="viewRegistrations(${event.id})">View Registrations</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Search Logic
        function searchEvents() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtered = allEvents.filter(event =>
                event.title.toLowerCase().includes(query) ||
                event.description.toLowerCase().includes(query) ||
                event.location.toLowerCase().includes(query)
            );
            displayEvents(filtered);
        }

        // Action Functions
        function deleteEvent(id) {
            if(!confirm("Are you sure you want to delete this event?")) return;
            fetch("/delete-event/" + id, { method: "DELETE" })
                .then(() => {
                    alert("Event removed successfully.");
                    loadEvents();
                })
                .catch(err => alert("Error deleting event."));
        }

        function editEvent(id) { window.location.href = "/edit-event/" + id; }
        function openEvent(id) { window.location.href = "/event/" + id; }
        function viewRegistrations(id) { window.location.href = "/registrations.html?eventId=" + id; }

        // Initial Load
        loadEvents();
    </script>

</body>
</html>
