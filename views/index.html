<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub | Premium</title>
    
    <style>
        /* 1. THE RESET - This removes the "ugly" browser defaults */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #06060c; /* Deep space blue */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* 2. THE BACKGROUND - Glowing soft shapes */
        .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #12122b 0%, #06060c 100%);
        }

        .blob {
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            filter: blur(80px);
            border-radius: 50%;
            opacity: 0.25;
            animation: float 10s infinite alternate;
        }

        @keyframes float {
            from { transform: translate(-20px, -20px); }
            to { transform: translate(20px, 20px); }
        }

        /* 3. THE GLASS CARD - This is the "Professional" look */
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        h1 span {
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            margin-bottom: 32px;
            font-size: 0.95rem;
        }

        /* 4. BUTTONS - Modern rounded style */
        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: block;
        }

        .btn-main {
            background: #ffffff;
            color: #06060c;
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            margin-top: 8px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            filter: brightness(1.1);
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 10px 0;
        }

        footer {
            margin-top: 32px;
            font-size: 0.75rem;
            color: #475569;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="blob" style="top: -100px; right: -100px;"></div>
    <div class="blob" style="bottom: -100px; left: -100px; animation-delay: -5s;"></div>

    <div class="card">
        <header>
            <h1>Event<span>Hub</span></h1>
            <p>Your portal to seamless planning.</p>
        </header>

        <div class="btn-stack">
            <a href="/login" class="btn btn-main">Log In</a>
            <a href="/signup" class="btn btn-outline">Sign Up</a>
            
            <div class="divider"></div>
            
            <a href="/event-list" class="btn btn-gradient">Explore Events</a>
            <a href="/create-event" class="btn btn-gradient">Host an Event</a>
        </div>

        <footer>
            &copy; 2026 EventHub Platform
        </footer>
    </div>

</body>
</html>
